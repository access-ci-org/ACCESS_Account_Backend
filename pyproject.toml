[project]
name = "access-ci-account-api"
version = "0.15.0"
description = "API for ACCESS CI accounts and registration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PyJWT>=2.8.0",
    "argon2-cffi>=25.1.0",
    "asyncache>=0.1.1",
    "boto3>=1.41.2",
    "cachetools>=7.1.1",
    "fastapi-utilities>=0.3.1",
    "fastapi[standard]>=0.120.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pymemcache>=4.0.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.27",
    "tldextract>=5.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
# All endpoints and service clients are async; "auto" mode lets us write
# `async def test_...` without decorating each one.
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
# App modules live at the project root; shared test helpers (factories.py) live
# in tests/. Put both on sys.path so tests in any subdirectory can import them.
pythonpath = [".", "tests"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "generate_token.py",
    "main.py:main",
]

[tool.coverage.report]
show_missing = true
